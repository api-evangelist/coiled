name: Coiled
description: >-
  Coiled is a lightweight cloud compute platform that lets Python developers scale
  their code to thousands of cloud machines without managing Kubernetes, Docker, or
  infrastructure. Built by the maintainers of Dask, Coiled provisions cloud VMs and
  Dask clusters in a user's own AWS, GCP, or Azure account, automatically replicates
  the local software environment, runs the work across large clusters, and tears the
  resources back down when finished. It powers Dask clusters, serverless functions,
  batch jobs, hosted Jupyter notebooks, and interactive CLI jobs, and exposes a
  first-party Python client, a `coiled` command-line interface, and a token-authenticated
  REST API. Coiled was surfaced as a portfolio company of Bessemer Venture Partners.
